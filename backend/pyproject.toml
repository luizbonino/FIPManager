[project]
name = "fipm"
version = "0.1.0"
description = "FIP Manager backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "rdflib>=7.0",
    "qrcode[pil]>=7.4",
    # spec 11-nanopub-network.md §3.4: was a dev-only dependency (the test
    # client already pulled it in transitively); the nanopub-network proxy
    # (fipm/network.py) is the first module to call it at runtime.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fipm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/Body() are meant to be used as call-in-default-value.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# The spec 03-matrix-and-rdf.md §2.7 Turtle example is pasted verbatim as a
# fixture string, so its line lengths (and the JSON request bodies around
# it) aren't reformatted to stay byte-faithful to the spec text.
"tests/test_rdf_export.py" = ["E501"]
# spec 11-nanopub-network.md §3.1's SPARQL templates are module constants
# quoted verbatim (acceptance criterion 4: byte-identical to the spec), and
# the test that asserts that byte-identity quotes the same text again as its
# own oracle -- neither may be reflowed to fit the line-length limit.
"fipm/network.py" = ["E501"]
"tests/test_ac_11_05_network_safety.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
