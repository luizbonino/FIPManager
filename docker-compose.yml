services:
  fipm:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - fipm-data:/data
    environment:
      FIPM_DB_PATH: /data/fipm.db
      FIPM_COOKIE_SECURE: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fipm-data:
