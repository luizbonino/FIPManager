<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FIP Manager - FAIR Implementation Profile Tool" />
    <title>FIP Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-text: #ffffff;
      --color-secondary: #64748b;
      --color-secondary-text: #ffffff;
      --color-background: #ffffff;
      --color-text: #1e293b;
      --color-header: #f8fafc;
      --color-border: #e2e8f0;
      --color-hover: #f1f5f9;
      --color-error: #ef4444;
      --color-error-bg: #fee2e2;
      --color-link: #2563eb;
      --color-user-info: #e0f2fe;
      --color-user-info-text: #0369a1;
    }
    
    .dark {
      --color-background: #0f172a;
      --color-text: #f1f5f9;
      --color-header: #1e293b;
      --color-border: #334155;
      --color-hover: #334155;
      --color-user-info: #0369a1;
      --color-user-info-text: #e0f2fe;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.5;
      background-color: var(--color-background);
      color: var(--color-text);
